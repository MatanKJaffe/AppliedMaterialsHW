services:
  - type: web
    name: dataset-explorer-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /tables
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RELOAD
        value: "false"
